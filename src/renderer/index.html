<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snapback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toolbar">
    <div class="group">
      <span class="label">Brush</span>
      <button class="brush-size-button size-5 active" data-size="5" title="Small brush"></button>
      <button class="brush-size-button size-10" data-size="10" title="Medium brush"></button>
      <button class="brush-size-button size-20" data-size="20" title="Large brush"></button>
    </div>
    <div class="group">
      <span class="label">Color</span>
      <!-- Color wheel from red, full saturation, including tertiaries -->
      <button class="color-button active" data-color="#ff0000" style="background:#ff0000;" title="Red"></button>
      <button class="color-button" data-color="#ff4000" style="background:#ff4000;" title="Red-Orange"></button>
      <button class="color-button" data-color="#ff8000" style="background:#ff8000;" title="Orange"></button>
      <button class="color-button" data-color="#ffbf00" style="background:#ffbf00;" title="Yellow-Orange"></button>
      <button class="color-button" data-color="#ffff00" style="background:#ffff00;" title="Yellow"></button>
      <button class="color-button" data-color="#bfff00" style="background:#bfff00;" title="Yellow-Green"></button>
      <button class="color-button" data-color="#00ff00" style="background:#00ff00;" title="Green"></button>
      <button class="color-button" data-color="#00ffbf" style="background:#00ffbf;" title="Blue-Green"></button>
      <button class="color-button" data-color="#00ffff" style="background:#00ffff;" title="Cyan / Blue"></button>
      <button class="color-button" data-color="#0000ff" style="background:#0000ff;" title="Blue"></button>
      <button class="color-button" data-color="#4000ff" style="background:#4000ff;" title="Blue-Violet"></button>
      <button class="color-button" data-color="#ff00ff" style="background:#ff00ff;" title="Magenta / Red-Violet"></button>
    </div>
  </div>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>
  <script src="index.js"></script>
</body>
</html>
