<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Black rounded-square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="#000000"/>

  <!-- White pencil body -->
  <g transform="rotate(-35 256 256)">
    <!-- Pencil shaft -->
    <rect x="184" y="144" width="144" height="176" rx="28" ry="28" fill="#ffffff"/>
    <!-- Eraser band -->
    <rect x="184" y="144" width="144" height="32" fill="#d9d9d9"/>
    <!-- Tip base -->
    <rect x="184" y="320" width="144" height="32" fill="#cccccc"/>
    <!-- Pencil tip -->
    <polygon points="184,352 256,416 328,352" fill="#ffffff"/>
    <polygon points="216,352 256,392 296,352" fill="#d0d0d0"/>
  </g>
</svg>


