[package]
name = "snapback"
version = "0.2.0"
description = "Fast image feedback for artists"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
